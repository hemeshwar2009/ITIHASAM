<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITIHASAM — An Interactive Cultural Heritage Experience</title>
  <meta name="description" content="Itihasam: explore India's history, forgotten traditional games, architectural wonders, festivals, and regional cultures across all 28 states through interactive games and storyboards." />
  <meta name="theme-color" content="#B69A62" />
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/img/icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Open Graph (link previews when the site is shared) -->
  <meta property="og:title" content="Itihasam — Explore. Play. Preserve." />
  <meta property="og:description" content="28 States. Countless Stories. One Living Heritage." />
  <meta property="og:type" content="website" />

  <!-- Google Fonts: Royal Cinzel, Classical Marcellus, Modern Sans, Devanagari & Tamil -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Marcellus&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Ancient White Theme Stylesheets -->
  <link rel="stylesheet" href="styles/ancient-white.css" />
  <link rel="stylesheet" href="styles/landing.css" />
  <link rel="stylesheet" href="styles/toolbar.css" />
  <link rel="stylesheet" href="styles/states.css" />
  <link rel="stylesheet" href="styles/games.css" />
  <link rel="stylesheet" href="styles/slideshow.css" />
  <link rel="stylesheet" href="styles/rewards.css" />
  <link rel="stylesheet" href="styles/avatar.css" />
  <link rel="stylesheet" href="styles/chatbot.css" />
  <link rel="stylesheet" href="styles/features.css" />

  <style>
    /* Game View Specific Breadcrumb Bar */
    .game-view-outer-wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px;
    }
    .game-view-breadcrumb {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 18px;
      margin-bottom: 20px;
    }
    .breadcrumb-info {
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-view-container">Skip to main content</a>

  <!-- App Main Root -->
  <div id="app-root">
    <!-- Dynamic Main View Container -->
    <main id="main-view-container" tabindex="-1"></main>

    <!-- Persistent Right-Side Vertical Toolbar Mount -->
    <div id="toolbar-mount"></div>

    <!-- Floating Chatbot Companion Mount (Bottom-Right) -->
    <div id="chatbot-mount"></div>
  </div>

  <noscript>
    <p style="padding:24px;font-family:Georgia,serif">Itihasam needs JavaScript to run. Please enable it, and open the site through a local server (see README).</p>
  </noscript>

  <!-- Main ES Module Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
